plugins {
    id "org.jetbrains.kotlin.jvm" version "1.9.22"
    id "org.jetbrains.compose" version "1.6.0"
    id "org.jlleitschuh.gradle.ktlint" version "12.1.1"
    id "com.github.johnrengelman.shadow" version "8.1.1"
    id "application"
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib"
    implementation compose.desktop.currentOs
    implementation compose.material3

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.1"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

kotlin {
    jvmToolchain(17)
}

// Application plugin configuration
application {
    mainClass = "MainKt"
}

// Configure run task to use stdin
tasks.named("run", JavaExec) {
    standardInput = System.in
}

// GUI tasks
tasks.register("runGui", JavaExec) {
    mainClass = "ViewGuiKt"
    classpath = sourceSets.main.runtimeClasspath
}

tasks.register("shadowGuiJar", com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveClassifier = "gui"
    from sourceSets.main.output
    configurations = [project.configurations.runtimeClasspath]
    manifest.attributes "Main-Class": "ViewGuiKt"
}

tasks.register("runShadowGui", JavaExec) {
    dependsOn tasks.named("shadowGuiJar")
    classpath = files(tasks.named("shadowGuiJar"))
}